<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>X Feed Image Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="container">
    <h1>X Feed Image Downloader</h1>

    <label for="profileUrl">Profile URL</label>
    <input id="profileUrl" type="url"
           placeholder="https://x.com/username">

    <div class="row">
      <label class="check">
        <input id="includeQuoted" type="checkbox">
        Include quoted tweets
      </label>
    </div>

    <div class="row">
      <label for="maxTweets">Maximum tweets</label>
      <input id="maxTweets" type="number" min="1" max="10000" value="500">
    </div>

    <div class="row">
      <label for="scrollDelay">Scroll delay, ms</label>
      <input id="scrollDelay" type="number" min="500" max="10000" value="1500">
    </div>

    <div class="buttons">
      <button id="start">START</button>
      <button id="stop" class="secondary">STOP</button>
    </div>

    <div id="status" class="status">Ready</div>

    <div class="stats">
      <div>Tweets scanned <span id="tweets">0</span></div>
      <div>Images found <span id="found">0</span></div>
      <div>Downloaded <span id="downloaded">0</span></div>
      <div>Skipped <span id="skipped">0</span></div>
    </div>

    <div class="hint">
      Open the extension while the X profile page is active, or enter a
      profile URL above.
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
